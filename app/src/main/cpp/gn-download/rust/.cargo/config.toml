# Cross-compile settings for the Android builds of libgndownload.so.
#
# The linker is resolved by NAME on PATH: prepend the NDK's
# `toolchains/llvm/prebuilt/<host>/bin` directory to PATH and export
# CC_<target> / AR_<target> for the C-compiling dependencies (`ring`, pulled in
# by rustls). API level 26 matches minSdkVersion in app/build.gradle.kts.

[target.aarch64-linux-android]
linker = "aarch64-linux-android26-clang"
rustflags = ["-C", "link-arg=-Wl,-soname,libgndownload.so"]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi26-clang"
rustflags = ["-C", "link-arg=-Wl,-soname,libgndownload.so"]
