# Tests get a bare Application unless they opt into PluviaApp with @Config(application = PluviaApp::class).
# PluviaApp.onCreate starts PostHog, Play Integrity, billing, migrations and background threads; booting it
# before every test made later tests in the same JVM several times slower and pushed CI past its timeout.
# app/src/testModern/resources/robolectric.properties replaces this file for the Modern flavor;
# keep the two in step.
application=android.app.Application
