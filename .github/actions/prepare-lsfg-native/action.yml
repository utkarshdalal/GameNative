name: Prepare GameNative LSFG native runtime
description: Build the exact lsfg-vk-android gitlink into the arm64 Android package
inputs:
  ndk-version:
    description: Android NDK revision used by the validated LSFG Android build
    required: false
    default: '27.3.13750724'
runs:
  using: composite
  steps:
    - name: Build pinned arm64 LSFG layer
      shell: bash
      env:
        ANDROID_NDK_VERSION: ${{ inputs.ndk-version }}
        ANDROID_ABI: arm64-v8a
        HOST_TAG: linux-x86_64
      run: |
        set -euo pipefail
        native_dir=app/src/main/cpp/lsfg-vk-android
        layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
        native_manifest="$native_dir/VkLayer_LS_frame_generation.json"
        runtime_manifest=app/src/main/assets/lsfg_vk/android_arm64_v8a/VkLayer_LS_frame_generation.json
        runtime_manager=app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
        runtime_test=app/src/test/java/app/gamenative/utils/LsfgVkManagerTest.kt
        expected_commit="$(git rev-parse HEAD:${native_dir})"
        expected_prefix="${expected_commit:0:8}"

        git submodule sync -- "$native_dir"
        git submodule update --init --recursive -- "$native_dir"
        actual_commit="$(git -C "$native_dir" rev-parse HEAD)"
        if [[ "$actual_commit" != "$expected_commit" ]]; then
          echo "ERROR: LSFG submodule checkout ${actual_commit} != GameNative gitlink ${expected_commit}" >&2
          exit 1
        fi
        echo "Building GameNative-pinned LSFG native revision ${actual_commit}"

        # The checked-in Kotlin marker describes the checked-in jniLibs payload.
        # CI replaces only its native SHA token (and the matching assertion) after
        # resolving the gitlink, so every prepared APK identifies the exact native
        # revision it actually packages without a second manually maintained SHA.
        python3 - "$runtime_manager" "$runtime_test" "$expected_prefix" <<'PY'
        import pathlib
        import re
        import sys

        manager = pathlib.Path(sys.argv[1])
        test = pathlib.Path(sys.argv[2])
        expected_prefix = sys.argv[3]

        manager_text = manager.read_text(encoding="utf-8")
        manager_pattern = re.compile(r"(gamenative-presentsync-)[0-9a-f]{8}(-r[0-9]+)")
        manager_text, manager_count = manager_pattern.subn(
            rf"\g<1>{expected_prefix}\g<2>", manager_text, count=1
        )
        if manager_count != 1:
            raise SystemExit("ERROR: could not rewrite the LSFG runtime marker")
        manager.write_text(manager_text, encoding="utf-8")

        test_text = test.read_text(encoding="utf-8")
        test_pattern = re.compile(
            r'(loaderVersion\.readText\(\)\.contains\(")[0-9a-f]{8}("\))'
        )
        test_text, test_count = test_pattern.subn(
            rf"\g<1>{expected_prefix}\g<2>", test_text, count=1
        )
        if test_count != 1:
            raise SystemExit("ERROR: could not rewrite the LSFG runtime provenance assertion")
        test.write_text(test_text, encoding="utf-8")
        PY

        grep -Fq "$expected_prefix" "$runtime_manager"
        grep -Fq "$expected_prefix" "$runtime_test"
        git diff --check -- "$runtime_manager" "$runtime_test"

        python3 "$native_dir/tests/android_ahb_portability_test.py"
        python3 "$native_dir/tests/android_wsi_loader_bridge_test.py"
        python3 "$native_dir/tests/android_wsi_provenance_test.py"
        python3 "$native_dir/tests/android_runtime_stability_test.py"

        sudo apt-get update -qq
        sudo apt-get install -y cmake ninja-build file g++
        g++ -std=c++20 -Wall -Wextra -Werror \
          -I"$native_dir/include" \
          "$native_dir/src/adaptive_scheduler.cpp" \
          "$native_dir/tests/adaptive_scheduler_test.cpp" \
          -o /tmp/lsfg-adaptive-scheduler-test
        /tmp/lsfg-adaptive-scheduler-test
        sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [[ -z "$sdk_root" ]]; then
          echo 'ERROR: Android SDK root is not configured' >&2
          exit 1
        fi
        export ANDROID_NDK_ROOT="${sdk_root}/ndk/${ANDROID_NDK_VERSION}"
        export ANDROID_NDK="$ANDROID_NDK_ROOT"
        readelf_bin="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
        test -x "$readelf_bin"

        (
          cd "$native_dir"
          bash ./scripts/build/android.sh Release
        )

        built="$native_dir/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so"
        test -s "$built"
        cp "$built" "$layer"
        test -s "$layer"
        file "$layer"
        sha256sum "$layer"

        test -s "$native_manifest"
        python3 - "$native_manifest" "$runtime_manifest" <<'PY'
        import json
        import pathlib
        import sys

        source = pathlib.Path(sys.argv[1])
        destination = pathlib.Path(sys.argv[2])
        with source.open("r", encoding="utf-8") as handle:
            manifest = json.load(handle)

        layer = manifest.get("layer")
        if not isinstance(layer, dict):
            raise SystemExit("ERROR: native LSFG manifest has no layer object")
        for required in ("name", "api_version", "functions"):
            if required not in layer:
                raise SystemExit(f"ERROR: native LSFG manifest is missing layer.{required}")

        manifest["layer"]["library_path"] = "../../../lib/liblsfg-vk-layer.so"
        destination.parent.mkdir(parents=True, exist_ok=True)
        with destination.open("w", encoding="utf-8") as handle:
            json.dump(manifest, handle, indent=2)
            handle.write("\n")

        print(f"Synchronized LSFG runtime manifest api_version={manifest['layer']['api_version']}")
        PY
        test -s "$runtime_manifest"

        needed="$($readelf_bin -d "$layer")"
        printf '%s\n' "$needed"
        grep -q 'Shared library: \[libnativewindow.so\]' <<<"$needed"
        if grep -q 'Shared library: \[libandroid.so\]' <<<"$needed"; then
          echo 'ERROR: LSFG must not directly depend on libandroid.so' >&2
          exit 1
        fi
