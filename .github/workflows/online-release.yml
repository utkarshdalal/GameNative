name: GameNative Online Release

# Builds an installable Legacy Release APK (debug-signed; no upstream keystore required)
# and publishes it to GitHub Releases.
on:
  push:
    tags:
      - "gamenative-online-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. gamenative-online-v0.1.1)"
        required: true
        default: "gamenative-online-v0.1.1"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - uses: actions/checkout@v4

      - name: set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=
          CLOUD_PROJECT_NUMBER=
          EOF

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.txt || true
          yes | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1" || true

      - name: Build Legacy Release APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleLegacyRelease \
            -Pkotlin.daemon.jvmargs=-Xmx3g \
            --stacktrace \
            --no-daemon 2>&1 | tee gradle-release.log
        continue-on-error: true

      - name: Publish build log on failure
        if: steps.build.outcome != 'success'
        run: |
          {
            echo "## Gradle build failed"
            echo ""
            echo '```'
            tail -n 120 gradle-release.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface last ERROR/e: lines as annotations (visible without log download)
          grep -E "e: |FAILED|error:|What went wrong|FAILURE:" gradle-release.log | tail -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-log
          path: gradle-release.log
          if-no-files-found: ignore

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=gamenative-online-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        run: |
          SRC=$(ls app/build/outputs/apk/legacy/release/*.apk | head -n 1)
          test -n "$SRC"
          cp "$SRC" "${{ steps.meta.outputs.apk_name }}"
          ls -lh "${{ steps.meta.outputs.apk_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## GameNative Online — first public build

            Installable **Legacy Release** APK with Online/Offline install profiles, honest multiplayer badges, Online Ready tab, and Phase 4 hardening.

            ### Downloads
            - **`${{ steps.meta.outputs.apk_name }}`** — standard phone/tablet build (recommended)

            ### Notes
            - Signed with the Android **debug** keystore (fork release; not Play Store / upstream dual-sign).
            - Uninstall upstream GameNative first if package id conflicts, or sideload carefully.
            - Online multiplayer is **not** guaranteed for every title — check badges (`ONLINE OK` / `FLAKY` / `BLOCKED`).
            - Anti-cheat titles remain unsupported.

            Branch: `develop` · Plan: [PLAN.MD](../blob/develop/PLAN.MD) · Matrix: [COMPATIBILITY.md](../blob/develop/docs/online/COMPATIBILITY.md)
          files: |
            ${{ steps.meta.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
