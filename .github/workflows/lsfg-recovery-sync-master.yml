name: LSFG recovery sync master

on:
  push:
    branches:
      - fix/restore-lsfg-regression-fixes-20260904
    paths:
      - .github/workflows/lsfg-recovery-sync-master.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/restore-lsfg-regression-fixes-20260904
          fetch-depth: 0

      - name: Merge current master and remove one-shot workflow
        run: |
          set -euo pipefail
          git fetch origin master
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff --no-commit origin/master
          rm .github/workflows/lsfg-recovery-sync-master.yml
          git add -A
          git diff --cached --check
          git commit -m 'merge: sync LSFG recovery with current master'
          git push origin HEAD:fix/restore-lsfg-regression-fixes-20260904
