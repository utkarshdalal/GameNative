name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: gamenative-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build diagnostic LSFG arm64 layer
        env:
          ANDROID_NDK_VERSION: 27.3.13750724
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
          LSFG_NATIVE_COMMIT: 4ea941c7292d1adc14037377c1c9034cb5de4c1c
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK="${ANDROID_NDK_ROOT}"
          cd app/src/main/cpp/lsfg-vk-android
          git fetch https://github.com/Ragnarok93/lsfg-vk-android.git "${LSFG_NATIVE_COMMIT}"
          git checkout --detach "${LSFG_NATIVE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${LSFG_NATIVE_COMMIT}"
          bash ./scripts/build/android.sh Release
          cd -
          layer=app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          cp app/src/main/cpp/lsfg-vk-android/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so "$layer"
          file "$layer"
          needed="$(${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d "$layer")"
          printf '%s\n' "$needed"
          grep -q 'Shared library: \[libnativewindow.so\]' <<<"$needed"
          if grep -q 'Shared library: \[libandroid.so\]' <<<"$needed"; then
            echo 'ERROR: LSFG still directly depends on libandroid.so' >&2
            exit 1
          fi

      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Legacy debug unit tests
        run: ./gradlew :app:testLegacyDebugUnitTest --no-daemon

      - name: Assemble Legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon

      - name: Split LegacyDebug APK for verified transfer
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected exactly one LegacyDebug APK, found %d\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          mkdir -p /tmp/gamenative-legacy-debug
          apk=/tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk
          cp "${apks[0]}" "$apk"
          sha256sum "$apk" | tee /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          split -b 180M -d -a 1 "$apk" /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-
          ls -lh /tmp/gamenative-legacy-debug/

      - name: Upload LegacyDebug part 0
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-0
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-0
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug part 1
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-1
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-1
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug part 2
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-2
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-2
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug part 3
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-part-3
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.part-3
          if-no-files-found: error
          compression-level: 0

      - name: Upload LegacyDebug checksum
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug-sha256
          path: /tmp/gamenative-legacy-debug/gamenative-legacy-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
