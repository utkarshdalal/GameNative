name: Pull Request build check

on:
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: gamenative-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  legacy-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build diagnostic LSFG arm64 layer
        env:
          ANDROID_NDK_VERSION: 27.3.13750724
          ANDROID_ABI: arm64-v8a
          HOST_TAG: linux-x86_64
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build file
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK="${ANDROID_NDK_ROOT}"
          cd app/src/main/cpp/lsfg-vk-android
          bash ./scripts/build/android.sh Release
          cd -
          cp app/src/main/cpp/lsfg-vk-android/build-android-arm64-v8a/dist/liblsfg-vk-arm64-v8a.so \
             app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
          file app/src/main/jniLibs/arm64-v8a/liblsfg-vk-layer.so
      - name: Inject credentials
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties
      - name: Inject dummy credentials
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          EOF
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble Legacy debug APK
        run: ./gradlew :app:assembleLegacyDebug --no-daemon
      - name: Upload Legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug
          path: app/build/outputs/apk/legacy/debug/*.apk
          if-no-files-found: error
