name: LUDASHI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "ludashi/**"

permissions:
  contents: read

concurrency:
  group: ludashi-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "ndk;27.3.13750724"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Create Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Build modern Android debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleModernDebug

      - name: Upload LUDASHI APK
        uses: actions/upload-artifact@v4
        with:
          name: LUDASHI-modern-debug
          path: app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          retention-days: 14
