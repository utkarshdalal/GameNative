name: LSFG recovery one-shot patch

on:
  push:
    branches:
      - fix/restore-lsfg-regression-fixes-20260904
    paths:
      - .github/workflows/lsfg-recovery-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/restore-lsfg-regression-fixes-20260904
          fetch-depth: 0

      - name: Restore readiness-gated LSFG pacing handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt')
          text = path.read_text()

          renderer_old = '        xServerView?.setFrameRateLimit(if (isLsfgAvailable && lsfgMultiplier >= 2) 0 else limit)'
          renderer_new = '        val lsfgActive = isLsfgAvailable && lsfgMultiplier >= 2\n        xServerView?.setFrameRateLimit(if (lsfgActive) 0 else limit)'
          present_old = '            ?.setFrameRateLimit(if (isLsfgAvailable && lsfgMultiplier >= 2) 0 else limit)'
          present_new = '            ?.transitionFramePacing(lsfgActive, limit)'
          stride_old = '            if (isLsfgAvailable && lsfgMultiplier >= 2) lsfgMultiplier else 1'
          stride_new = '            if (lsfgActive) lsfgMultiplier else 1'

          replacements = (
              (renderer_old, renderer_new, 'renderer pacing handoff'),
              (present_old, present_new, 'Present pacing handoff'),
              (stride_old, stride_new, 'frame sample stride'),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one {label}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/lsfg-recovery-one-shot.yml').unlink()
          PY

          git diff --check
          grep -Fq 'val lsfgActive = isLsfgAvailable && lsfgMultiplier >= 2' app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt
          grep -Fq '?.transitionFramePacing(lsfgActive, limit)' app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt
          ! grep -Fq '?.setFrameRateLimit(if (isLsfgAvailable && lsfgMultiplier >= 2) 0 else limit)' app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt

      - name: Commit recovered pacing contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt .github/workflows/lsfg-recovery-one-shot.yml
          git commit -m 'fix(lsfg): restore readiness-gated pacing handoff'
          git push origin HEAD:fix/restore-lsfg-regression-fixes-20260904
