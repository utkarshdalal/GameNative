name: Finalize verified LSFG present sync revision

on:
  push:
    branches:
      - lsfg/vulkan-capability-detection

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: lsfg/vulkan-capability-detection
          fetch-depth: 0
          submodules: recursive

      - name: Pin verified native synchronization revision
        env:
          LSFG_NATIVE_COMMIT: 6569c33f83adf09bfbc9158e024ea7cbccbbb890
        shell: bash
        run: |
          set -euo pipefail
          native=app/src/main/cpp/lsfg-vk-android
          git -C "$native" fetch https://github.com/Ragnarok93/lsfg-vk-android.git "$LSFG_NATIVE_COMMIT"
          git -C "$native" checkout --detach "$LSFG_NATIVE_COMMIT"
          test "$(git -C "$native" rev-parse HEAD)" = "$LSFG_NATIVE_COMMIT"

      - name: Unify runtime and CI provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          native = "6569c33f83adf09bfbc9158e024ea7cbccbbb890"

          manager = Path("app/src/main/java/app/gamenative/utils/LsfgVkManager.kt")
          text = manager.read_text(encoding="utf-8")
          old = '"v1.3.3-android-arm64-v8a-gamenative-ahb-hotreload-ee0e265c-r5"'
          new = '"v1.3.3-android-arm64-v8a-gamenative-ahb-present-sync-6569c33f-r6"'
          if text.count(old) != 1:
              raise SystemExit(f"expected one old runtime marker, found {text.count(old)}")
          manager.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/pluvia-pr-check.yml")
          text = workflow.read_text(encoding="utf-8")
          old_pin = "LSFG_NATIVE_COMMIT: 2d803ea84d34aea3b1b5c7d018fd137b17302675"
          new_pin = f"LSFG_NATIVE_COMMIT: {native}"
          if text.count(old_pin) != 1:
              raise SystemExit(f"expected one legacy CI native pin, found {text.count(old_pin)}")
          text = text.replace(old_pin, new_pin, 1)

          anchor = "          --tests com.winlator.widget.FrameRatingTest\n"
          addition = anchor + "          --tests com.winlator.widget.XServerFrameRatingRetargetContractTest\n"
          if "XServerFrameRatingRetargetContractTest" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f"expected one FrameRating test anchor, found {text.count(anchor)}")
              text = text.replace(anchor, addition, 1)
          workflow.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot patch workflows and verify exact state
        env:
          LSFG_NATIVE_COMMIT: 6569c33f83adf09bfbc9158e024ea7cbccbbb890
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-frame-rating-retarget-fix.yml
          rm -f .github/workflows/finalize-lsfg-present-sync.yml
          test "$(git -C app/src/main/cpp/lsfg-vk-android rev-parse HEAD)" = "$LSFG_NATIVE_COMMIT"
          grep -q 'gamenative-ahb-present-sync-6569c33f-r6' app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          grep -q "LSFG_NATIVE_COMMIT: $LSFG_NATIVE_COMMIT" .github/workflows/pluvia-pr-check.yml
          grep -q 'rating.resetSamplingEpoch()' app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt
          grep -q 'XServerFrameRatingRetargetContractTest' .github/workflows/pluvia-pr-check.yml
          git diff --check

      - name: Commit finalized verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(lsfg): pin verified Android present synchronization"
          git push origin HEAD:lsfg/vulkan-capability-detection
