name: Debug APK

on:
  push:
    branches: [ "fix/controller-routing-unassigned-slot" ]
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject dummy credentials
        run: |
          cat <<EOF > local.properties
          POSTHOG_API_KEY=dummy
          POSTHOG_HOST=https://us.i.posthog.com
          STEAMGRIDDB_API_KEY=dummy
          CLOUD_PROJECT_NUMBER=dummy
          EOF

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APKs
        run: |
          ./gradlew -Pkotlin.daemon.jvmargs=-Xmx6g :app:assembleLegacyDebug
          ./gradlew -Pkotlin.daemon.jvmargs=-Xmx6g :app:assembleModernDebug
          free -m

      - name: Upload Legacy debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-native-legacy-debug
          path: app/build/outputs/apk/legacy/debug/*.apk

      - name: Upload Modern debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-native-modern-debug
          path: app/build/outputs/apk/modern/debug/*.apk
