name: Apply PR8 first-present runtime pin

on:
  push:
    branches:
      - lsfg/vulkan-capability-detection

permissions:
  contents: write

jobs:
  apply-runtime-pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: lsfg/vulkan-capability-detection
          fetch-depth: 0

      - name: Update regression expectation and confirm RED
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/java/app/gamenative/utils/LsfgVkManagerTest.kt')
          text = path.read_text(encoding='utf-8')
          old = 'assertTrue(loaderVersion.readText().contains("ee0e265c"))'
          new = 'assertTrue(loaderVersion.readText().contains("d951bcad"))'
          if old not in text:
              raise SystemExit('old runtime lineage assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          printf 'POSTHOG_API_KEY=dummy\nPOSTHOG_HOST=https://us.i.posthog.com\n' > local.properties
          if ./gradlew :app:testLegacyDebugUnitTest --no-daemon --tests app.gamenative.utils.LsfgVkManagerTest; then
            echo 'ERROR: runtime marker test unexpectedly passed before production pin update' >&2
            exit 1
          fi
          echo 'RED confirmed: GameNative runtime marker still identifies the older native lineage'

      - name: Pin verified native diagnostics and runtime marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pluvia-pr-check.yml')
          text = workflow.read_text(encoding='utf-8')
          old_sha = 'LSFG_NATIVE_COMMIT: 2d803ea84d34aea3b1b5c7d018fd137b17302675'
          new_sha = 'LSFG_NATIVE_COMMIT: d951bcadd303d854ac7858cea490a0fa7fcef579'
          if text.count(old_sha) != 1:
              raise SystemExit('expected exactly one old native pin')
          workflow.write_text(text.replace(old_sha, new_sha, 1), encoding='utf-8')

          manager = Path('app/src/main/java/app/gamenative/utils/LsfgVkManager.kt')
          text = manager.read_text(encoding='utf-8')
          old_marker = 'v1.3.3-android-arm64-v8a-gamenative-ahb-hotreload-ee0e265c-r5'
          new_marker = 'v1.3.3-android-arm64-v8a-gamenative-presentdiag-d951bcad-r6'
          if text.count(old_marker) != 1:
              raise SystemExit('expected exactly one old runtime marker')
          manager.write_text(text.replace(old_marker, new_marker, 1), encoding='utf-8')
          PY

      - name: Confirm GREEN and commit
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testLegacyDebugUnitTest --no-daemon --tests app.gamenative.utils.LsfgVkManagerTest
          grep -q 'LSFG_NATIVE_COMMIT: d951bcadd303d854ac7858cea490a0fa7fcef579' .github/workflows/pluvia-pr-check.yml
          grep -q 'gamenative-presentdiag-d951bcad-r6' app/src/main/java/app/gamenative/utils/LsfgVkManager.kt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pluvia-pr-check.yml app/src/main/java/app/gamenative/utils/LsfgVkManager.kt app/src/test/java/app/gamenative/utils/LsfgVkManagerTest.kt
          git commit -m "lsfg: pin first-present diagnostics runtime"
          git push origin HEAD:lsfg/vulkan-capability-detection
