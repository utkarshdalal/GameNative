name: Actions artifact retention cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        default: normal
        type: choice
        options:
          - normal
          - emergency
  schedule:
    - cron: '17 6 * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: artifact-retention-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ github.event_name != 'issue_comment' || (github.actor == github.repository_owner && github.event.issue.pull_request && github.event.comment.body == '/artifact-storage emergency-purge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEANUP_MODE: ${{ github.event_name == 'issue_comment' && 'emergency' || inputs.mode || 'normal' }}
    steps:
      - name: Keep latest known-good artifacts and purge the rest
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const emergency = process.env.CLEANUP_MODE === 'emergency';

            async function inBatches(items, size, fn) {
              for (let i = 0; i < items.length; i += size) {
                await Promise.all(items.slice(i, i + size).map(fn));
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const liveArtifacts = artifacts.filter(a => !a.expired && a.workflow_run?.id);
            const runCache = new Map();
            const runIds = [...new Set(liveArtifacts.map(a => a.workflow_run.id))];

            await inBatches(runIds, 20, async (runId) => {
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
                runCache.set(runId, run);
              } catch (error) {
                core.warning(`Could not resolve workflow run ${runId}: ${error.message}`);
                runCache.set(runId, null);
              }
            });

            const latestGoodRun = new Map();
            for (const artifact of [...liveArtifacts].sort((a, b) => new Date(b.created_at) - new Date(a.created_at))) {
              const run = runCache.get(artifact.workflow_run.id);
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') continue;
              const key = `${run.path || run.name || 'unknown'}::${run.head_branch || 'detached'}`;
              if (!latestGoodRun.has(key)) latestGoodRun.set(key, run.id);
            }

            const keepRunIds = new Set(latestGoodRun.values());
            const toDelete = [];
            let preserved = 0;
            for (const artifact of liveArtifacts) {
              const run = runCache.get(artifact.workflow_run.id);
              if ((run && run.status !== 'completed') || keepRunIds.has(artifact.workflow_run.id) || !run) {
                preserved += 1;
                continue;
              }
              toDelete.push(artifact);
            }

            let deleted = 0;
            let reclaimedBytes = 0;
            await inBatches(toDelete, 20, async (artifact) => {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              deleted += 1;
              reclaimedBytes += artifact.size_in_bytes ?? 0;
              core.info(`Deleted superseded artifact: ${artifact.name}`);
            });

            let cachesDeleted = 0;
            if (emergency) {
              try {
                const caches = await github.paginate(github.rest.actions.getActionsCacheList, { owner, repo, per_page: 100 });
                await inBatches(caches, 20, async (cache) => {
                  await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                  cachesDeleted += 1;
                });
              } catch (error) {
                core.warning(`Actions cache purge was not available: ${error.message}`);
              }
            }

            const reclaimedMiB = (reclaimedBytes / 1024 / 1024).toFixed(1);
            const summary = `Deleted ${deleted} superseded artifact(s), preserved ${preserved} current/latest-known-good artifact(s), reclaimed approximately ${reclaimedMiB} MiB, and deleted ${cachesDeleted} Actions cache(s).`;
            await core.summary.addHeading(emergency ? 'Emergency artifact cleanup' : 'Artifact cleanup').addRaw(summary).write();

            if (context.eventName === 'issue_comment') {
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number: context.payload.issue.number, body: `Emergency artifact cleanup completed. ${summary}` });
              } catch (error) {
                core.warning(`Could not post cleanup summary comment: ${error.message}`);
              }
            }
