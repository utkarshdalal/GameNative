name: Fixed runtime LegacyDebug validation

on:
  push:
    branches:
      - fix/pin-fixed-runtime-stability-final-20260904
    paths:
      - .github/workflows/fixed-runtime-legacy-debug-one-shot.yml

jobs:
  legacy-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out GameNative
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare GameNative-pinned LSFG native runtime
        uses: ./.github/actions/prepare-lsfg-native

      - name: Inject credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          printf 'POSTHOG_API_KEY=%s\n' "${POSTHOG_API_KEY:-dummy}" > local.properties
          printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}" >> local.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile LegacyDebug and capture materialized GameDb source
        shell: bash
        run: |
          set +e
          ./gradlew :app:compileLegacyDebugKotlin --no-daemon
          status=$?
          echo '--- GameDb files after compile ---'
          find app -type f \( -iname '*GameDb*' -o -ipath '*gamedb*' \) -print || true
          echo '--- helper references under app/src ---'
          grep -R -n -E '\bhelper\b|class GameDbManager|object GameDbManager' app/src 2>/dev/null | head -300 || true
          target='app/src/main/java/app/gamenative/data/gamedb/GameDbManager.kt'
          if [[ -f "$target" ]]; then
            echo '--- GameDbManager.kt lines 120-190 ---'
            nl -ba "$target" | sed -n '120,190p'
            echo '--- git status for materialized source ---'
            git status --short -- "$target"
            echo '--- git check-ignore ---'
            git check-ignore -v "$target" || true
          fi
          exit "$status"

      - name: Prepare single LegacyDebug APK
        if: success()
        run: |
          set -euo pipefail
          ./gradlew :app:assembleLegacyDebug --no-daemon
          mapfile -t apks < <(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print)
          test ${#apks[@]} -eq 1
          cp "${apks[0]}" gamenative-legacy-debug.apk
          sha256sum gamenative-legacy-debug.apk
          ls -lh gamenative-legacy-debug.apk

      - name: Upload single LegacyDebug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-legacy-debug
          path: gamenative-legacy-debug.apk
          if-no-files-found: error
          compression-level: 0
