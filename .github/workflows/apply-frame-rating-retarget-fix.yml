name: Apply FrameRating retarget epoch fix

on:
  push:
    branches:
      - lsfg/vulkan-capability-detection

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: lsfg/vulkan-capability-detection
          fetch-depth: 0

      - name: Add retarget regression contract and confirm RED
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/test/java/com/winlator/widget/XServerFrameRatingRetargetContractTest.kt <<'EOF'
          package com.winlator.widget

          import java.io.File
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class XServerFrameRatingRetargetContractTest {
              private fun source(): String {
                  val candidates = listOf(
                      File("src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt"),
                      File("app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt"),
                  )
                  return candidates.firstOrNull { it.isFile }?.readText()
                      ?: error("Unable to locate XServerScreen.kt from test working directory")
              }

              @Test
              fun trackedWindowChangeResetsOnlySamplingEpoch() {
                  val source = source()
                  assertTrue(
                      "FrameRating retarget must clear inherited short-term timing/frame count",
                      source.contains("rating.resetSamplingEpoch()"),
                  )
                  assertFalse(
                      "Window retarget must not erase accumulated session statistics",
                      source.contains("rating.reset()\n                                rating.visibility = View.VISIBLE"),
                  )
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt").read_text(encoding="utf-8")
          if "rating.resetSamplingEpoch()" in source:
              raise SystemExit("ERROR: regression unexpectedly green before production patch")
          old = "rating.reset()\n                                rating.visibility = View.VISIBLE"
          if old not in source:
              raise SystemExit("ERROR: expected legacy retarget reset seam not found")
          print("RED confirmed: tracked-window retarget still calls full session reset")
          PY

      - name: Patch exact tracked-window retarget seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt")
          text = path.read_text(encoding="utf-8")
          old = "rating.reset()\n                                rating.visibility = View.VISIBLE"
          new = "rating.resetSamplingEpoch()\n                                rating.visibility = View.VISIBLE"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one FrameRating retarget seam, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Confirm GREEN source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt").read_text(encoding="utf-8")
          assert "rating.resetSamplingEpoch()" in source
          assert "rating.reset()\n                                rating.visibility = View.VISIBLE" not in source
          print("GREEN confirmed: window retarget preserves session aggregate")
          PY
          git diff --check

      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/app/gamenative/ui/screen/xserver/XServerScreen.kt \
            app/src/test/java/com/winlator/widget/XServerFrameRatingRetargetContractTest.kt
          git commit -m "fix(perf): reset FPS sampling epoch on window retarget"
          git push origin HEAD:lsfg/vulkan-capability-detection
